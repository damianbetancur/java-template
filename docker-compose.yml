version: '3.8'

services:
  mysql:
    image: mysql:8.3
    container_name: supermercadito-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: supermercadito
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      TZ: 'America/Argentina/Buenos_Aires'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - supermercadito-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
    driver: local

networks:
  supermercadito-network:
    driver: bridge

